name: Build Reconnaissance Factions

on:
  push:
    branches: [ "main", "reconnaissance-factions" ]
    paths:
      - "ReconnaissanceFactions/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "ReconnaissanceFactions/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build faction plugin
        working-directory: ReconnaissanceFactions
        run: gradle clean build
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ReconnaissanceFactions-JAR
          path: ReconnaissanceFactions/build/libs/ReconnaissanceFactions-*.jar
          if-no-files-found: error
          retention-days: 14
