name: Build Reconnaissance Factions

on:
  push:
    branches: [reconnaissance-factions]
    paths:
      - 'ReconnaissanceFactions/**'
      - '.github/workflows/build-factions.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build plugin
        working-directory: ReconnaissanceFactions
        run: gradle clean build
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ReconnaissanceFactions
          path: ReconnaissanceFactions/build/libs/*.jar
          if-no-files-found: error
